name: Go CI & Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Go Vet & CGO Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go Vet
        run: go vet ./...

      - name: Build C-ABI Shared Library (.so)
        run: |
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -buildmode=c-shared -o plugin-linux-amd64.so .
          ls -lh plugin-linux-amd64.so
